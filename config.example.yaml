# 复制为 config.yaml 后修改：cp config.example.yaml config.yaml
# config.yaml 含 Telegram token，已在 .gitignore 中排除，不要提交。

telegram:
  bot_token: ""                  # 找 @BotFather 创建机器人获得，留空则通知只打印到日志
  chat_ids: []                   # 接收通知的 chat id，可以多个，例如 [123456789, -1001234567890]

server:
  host: 127.0.0.1                # 部署到服务器且要外网访问时改成 0.0.0.0，并设置 access_token
  port: 8765
  access_token: ""               # 设置后网页需要 ?token=xxx 才能访问

monitor:
  price_interval: 30             # 实时价格刷新间隔（秒）
  daily_at: "00:05"              # 每天重算日线信号的时间（UTC），日线在 00:00 收盘
  near_stop: 0.05                # 现价距止损价不到 5% 时预警
  alerts:                        # 需要推送的盘中预警，不想收的改成 false
    stop_break: true             # 盘中跌破止损价
    near_stop: true              # 接近止损
    entry_watch: true            # 空仓的币盘中突破肯特纳上轨（收盘确认后会加仓）
    exit_watch: true             # 持仓的币盘中跌破肯特纳中线或 PBX 慢线（收盘不收回会减仓）
  daily_report: true             # 每天收盘后推送日报

dashboard:
  history_days: 420              # 每个币拉取的日线天数（指标预热需要约 300 天）
  min_history: 300               # 优先交易所的日线少于这个数时，改用下一个交易所（OKX > 币安 > Hyperliquid）
  chart_days: 180                # 页面走势图显示的天数
  refresh_seconds: 15            # 网页自动刷新间隔

# 候选名单：按币安 30 天成交额排名，monitor.py 每隔 update_days 天自动重建 coins.yaml
universe:
  auto_update: true              # 自动按季度更新名单
  update_days: 90                # 名单超过多少天重建一次（90 = 每季度）
  top: 40                        # 名单总数
  core: 12                       # 前几名为核心
  min_days: 365                  # 至少多少天历史

# 我的组合：只在这些币之间分配资金（仪表盘“我的组合”区域）
portfolio:
  capital: 100                   # 网页“我的组合”默认显示的总资金（U），网页上也可以临时修改
  first_batch: 0.5               # 首批进场比例：新建仓时先下目标金额的一半，1–2 周内补齐
  gap_buffer: 0.10               # 估算最坏亏损时，在止损距离之外再加的跳空缓冲
  coins: auto                    # auto = 跟随 coins.yaml 里的核心币（名单更新后自动变化）；也可以写成列表 [BTC, ETH, ...]

# 自动交易（OKX USDT 永续，逐仓，只做多）
# 建议顺序：dry_run 观察几天 → OKX 模拟盘（demo: true，用模拟盘 API key）→ 小资金实盘
trading:
  enabled: false                 # 总开关。false 时 monitor 不会自动交易，trader.py --live 也会拒绝下单
  dry_run: true                  # true = 只计算并推送“将要下的单”，不真实下单
  capital: 100                   # 交易本金（U）。实际使用 min(本金, 账户 USDT 权益)
  coins: []                      # 交易哪些币；留空 = 与“我的组合”相同
  rebalance_threshold: 0.2       # 持仓与目标相差超过目标的 20% 才调仓（目标为 0 时总是平仓）
  min_trade_usdt: 5              # 单笔调仓金额低于这个值不下单
  protective_buffer: 0.10        # 交易所保护止损单 = 止损价再往下 10%，只防盘中暴跌
  max_drawdown: 0.35             # 账户权益从最高点回撤超过 35%：熔断，暂停加仓（减仓、平仓照常）
  retry_minutes: 10              # 调仓有失败时，隔多少分钟重试（每根日线最多重试 3 次）
  log_dir: logs                  # 交易记录目录：trades.csv / equity.csv / decisions.jsonl / monitor.log
  okx:
    api_key: ""                  # OKX → API → 创建 API Key，权限只勾“交易”，不要勾“提现”，建议绑定服务器 IP
    api_secret: ""
    passphrase: ""
    demo: false                  # true = OKX 模拟盘（需要用模拟盘里创建的 API Key）

# 策略参数（与回测一致，改动后回测结果不再适用）
strategy:
  s1_fast: 12
  s1_slow: 26
  s2_n: 20
  s2_k: 1.5
  s2_atr: 10
  s3: [4, 6, 12]
  s4_n: 20

# 风控（BOT_SPEC 第 4、10、11 节）
risk:
  stop_drawdown: 0.25            # 持仓以来最高收盘价回落 25% 止损
  weight_cap: 0.25               # 单币权重上限
  b_grade_weight: 0.5            # B 级币权重系数
  strong_follow_corr: 0.70       # 与 BTC 相关系数达到此值算“强跟随”
  strong_follow_cap: 0.60        # 强跟随组合计敞口上限
  total_exposure_cap: 1.50       # 账户总名义敞口上限

# 杠杆上限（逐仓）。未列出的 A/B 级币用 default，C 级不交易
leverage:
  default: 1
  BTC: 2
  ETH: 1.5
  BNB: 1.5
  HYPE: 1.5
